<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PulseLive">
  <defs>
    <linearGradient id="pl-bg" x1="4" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#pl-bg)"/>
  <!-- play button (rounded corners via round-joined stroke) -->
  <path d="M21 19 L21 45 L43.5 32 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  <!-- pulse line inside the play button -->
  <path d="M24.5 32 L26.5 25.5 L30 38 L33.2 28.5 L35 32 H38.5" fill="none" stroke="url(#pl-bg)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live dot -->
  <circle cx="49.5" cy="14.5" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
